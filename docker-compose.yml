services:
  easy-dataset:
    image: swr.cn-south-1.myhuaweicloud.com/test2.0/easy-dataset:latest  # 华为云镜像 (自动拉取最新版本)
    build: .  # 同时支持本地构建 (使用 docker compose up --build)
    container_name: easy-dataset
    ports:
      - '1717:1717'
    volumes:
      - ./local-db:/app/local-db
      - ./prisma:/app/prisma  # 挂载 prisma 目录 (包含初始化的 db.sqlite)
    env_file:
      - .env  # 自动加载环境变量
    restart: unless-stopped
